# --- Trajectory ML data requirements (see README "Trajectory ML Data Requirements") ---
# These two settings are intentionally different and must not be conflated:
#   minimum_months_for_trajectory: the target extract/panel length (36+ months) needed
#     for credible ML training/eval once the WRDS extract window (config/wrds_extract.yml)
#     has backfilled enough history. This does NOT gate feature emission today.
#   min_observed_months_for_features: the minimum trailing observed months required per
#     entity before a trajectory_features row is emitted (YoY growth needs 12 prior months).
#     This is enforced in sql/duckdb/50_trajectory_features.sql via
#     `WHERE w.observed_months >= 12`. The SQL value is hardcoded (not read from this
#     YAML) because build_duckdb.py does not currently template config values into SQL
#     text. If you change min_observed_months_for_features here, you MUST also update the
#     matching literal in sql/duckdb/50_trajectory_features.sql, or wire config injection
#     into scripts/build_duckdb.py first.
minimum_months_for_trajectory: 36
min_observed_months_for_features: 12
# Dev snapshot export floor (make_dev_snapshot.py); does not affect Postgres trajectory row count.
min_row_threshold: 5
